#互联网监控接口 true表示开启
scheduled.netflow.topn.enable=true
scheduled.netflow.enable=true
#封堵信息接口 true表示开启
scheduled.block.enable=true
scheduled.block.topn.enable=true
#每个整10s触发一次
10s.scheduled.cron.plan=*/10 * * * * *
#每个整5分钟的30s触发
#eg：5m30s的时候查询00-05、10m30s的时候查询05-10
5m.scheduled.cron.plan=30 */5 * * * *
#每小时的30钟触发
1h.scheduled.cron.plan=30 * */1 * * *
#每天3点30触发
24h.scheduled.cron.plan=30 * 3 * * *
#测试用
1s.scheduled.cron.plan=*/1 * * * * *
#此服务的ip和端口本服务的service.port相同
