Configuration:
  status: info

  Properties: # 定义全局变量
    Property: # 缺省配置（用于开发环境）。其他环境需要在VM参数中指定，如下：
    #测试：-Dlog.level.console=warn -Dlog.level.xjj=trace
    #生产：-Dlog.level.console=warn -Dlog.level.xjj=info
    - name: log.level.console
      value: debug
    - name: log.level.galaxy
      value: debug
    - name: log.path
      value: F:/log/idea
    - name: project.name
      value: galaxy-push-service
  Appenders:
    Console:  #输出到控制台
      name: CONSOLE
      target: SYSTEM_OUT
      ThresholdFilter:
        level: ${sys:log.level.console} # “sys:”表示：如果VM参数中没指定这个变量值，则使用本文件中定义的缺省全局变量值
        onMatch: ACCEPT
        onMismatch: DENY
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss,SSS}:%4p %t (%l %x) - %m%n------->>"
    RollingFile: # 输出到文件，超过128MB归档
    - name: ROLLING_FILE
      ignoreExceptions: false
      fileName: ${log.path}/${project.name}.log
      filePattern: "${log.path}/$${date:yyyy-MM}/${project.name}-%d{yyyy-MM-dd}-%i.log.gz"
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss,SSS}:%4p %t (%l %x) - %m%n"
      Policies:
        TimeBasedTriggeringPolicy:
          modulate: true
          interval: 1
        DefaultRolloverStrategy:     # 文件最多200个
          max: 200
  Loggers:
    Root:
      level: info
      AppenderRef:
      - ref: CONSOLE
      - ref: ROLLING_FILE
    Logger: # 为com.nis包配置特殊的Log级别，方便调试
    - name: com.nis.galaxy.web.service
      additivity: false
      level: ${sys:log.level.galaxy}
      AppenderRef:
      - ref: CONSOLE
      - ref: ROLLING_FILE
