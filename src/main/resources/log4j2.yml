Properties:
  Property:
  - name: log.level.galaxy
    value: info
  - name: log.path
    value: F:/log/1120/idea
  - name: project.name
    value: galaxy-push-service
Appenders:
  Console:  #输出到控制台
    name: CONSOLE #Appender命名
    target: SYSTEM_OUT
    PatternLayout:
      pattern: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %t (%l:%x) - %m%n"
  RollingFile: # 输出到文件，每天归档
  - name: ROLLING_FILE
    ignoreExceptions: false
    fileName: ${log.path}/${project.name}.log
    filePattern: "${log.path}/$${date:yyyy-MM}/${project.name}-%d{yyyy-MM-dd}-%i.log.gz"
    PatternLayout:
      pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p %t %l %x - %m%n"
    Policies:
      TimeBasedTriggeringPolicy:
        modulate: true
        interval: 1
Loggers:
  Root:
    level: info
    AppenderRef:
    - ref: CONSOLE
    - ref: ROLLING_FILE
  Logger: # 为com.nis包配置特殊的Log级别，方便调试
  - name: com.nis.galaxy
    additivity: false
    level: ${sys:log.level.galaxy}
    AppenderRef:
    - ref: CONSOLE
    - ref: ROLLING_FILE
