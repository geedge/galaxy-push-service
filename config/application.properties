#服务端口
server.port=8017
#接收方的ip和端口
REST_URL_PREFIX_PUSH=http://10.3.54.6:12000
#REST_URL_PREFIX_PUSH=http://127.0.0.1:${server.port}

#是否开启测试数据(在真实数据为空时触发)：true表示开启，false表示关闭，（排除目标行为网络监测、网络行为预警接口）
Open.False.Data=false
#是否开启无数据时，最近数据的查询(只针对实时和累加接口：封堵信息整体显示、封堵信息分布显示、DNS欺骗信息)
Open.Recent.Data.Actual=false
#是否开启无数据时，最近数据的查询(只针对趋势图接口：网络流量监控、24小时内全国范围阻断协议信息、地域流量、端口流量)
Open.Recent.Data.Tendency=true
#是否开启无数据时，最近数据的查询（其余接口）
Open.Recent.Data=true
#中文:1、英文:2、俄语:3
Language.Chose=3

#互联网监控接口 true表示开启
scheduled.netflow.topn.enable=true
scheduled.netflow.enable=true
#封堵信息接口 true表示开启
scheduled.block.enable=true
scheduled.block.topn.enable=true
#监控接口 true表示开启
scheduled.monitor.enable=true
#Events接口
scheduled.events.enable=true

#每个整10s触发一次
10s.scheduled.cron.plan=*/10 * * * * *
#每分钟整点触发
1m.scheduled.cron.plan=0 */1 * * * *
#每个整5分钟的30s触发
#eg：5m30s的时候查询[00-05)、10m30s的时候查询[05-10)
5m.scheduled.cron.plan=30 */5 * * * *
#每小时的10分30钟触发
1h.scheduled.cron.plan=30 10 */1 * * *
#每天02:00:00触发
24h.scheduled.cron.plan=0 0 2 * * *
#字典表的刷新时间01:01:00（协议表、业务类型表、地域表、运营商）
dict.scheduled.cron.plan=0 1 1 * * *
#标签表的刷新时间每隔两小时的1min30s
dict.tag.cron.plan=30 1 */2 * * *
#临时地域映射表开关
dict.moment.switch=true
#测试用
1s.scheduled.cron.plan=*/1 * * * * *

#定时任务线程池
SCHEDULED.THREAD.POOL=5
#等待字典表的加载时间
DICT.WAIT=5000
#restTemplate配置
RestTemplate.ConnectTimeout=20000
RestTemplate.SocketTimeout=20000

#密钥
jasypt.encryptor.password=f6car
#接收方服务路径
SERVICE_PATH_BLOCKING=/v1/blocking
SERVICE_PATH_NETFLOW=/v1/netflow
SERVICE_PATH_MONITOR=/v1/system_monitoring
SERVICE_PATH_EVENTS=/v1/events
#spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html
#图片储存地址：1.若不指定怎为同jar目录下的image文件夹中，2.不指定时此处的key键不能去掉
Image.Path=
#部署设备数量
Device.Server.Num=10
Device.CoreSwtich.Num=20
Device.AccessSwitch.Num=30
Device.Asem.Num=10
Device.Adc.Num=30
#字符编码
Content-Type=application/json;charset=UTF-8
#Content-Type=application/json;charset=GBK
#推送失败时t_loop后再次推送单位:ms
t_loop=120000
