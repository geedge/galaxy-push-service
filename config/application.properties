#2018-12-18修改内容：修改增加 部署设备数量 49-59行
#服务端口
server.port=8017
#接收方的ip和端口
#REST_URL_PREFIX_PUSH=http://58.56.56.170:11000
REST_URL_PREFIX_PUSH=http://127.0.0.1:${server.port}
#是否开启测试数据(在真实数据为空时触发)：true表示开启，false表示关闭
Open.False.Data=false
#是否开启无数据时，最近数据的查询(目前只针对累加和实时的封堵整体、分布、DNS欺骗显示接口)
Open.Recent.Data.Actual=false
#是否开启无数据时，最近数据的查询(目前只针对趋势图接口)
Open.Recent.Data.Tendency=true
#是否开启无数据时，最近数据的查询（其余接口）
Open.Recent.Data=true
#推送请求头字符
Content-Type=application/json;charset=UTF-8
#定时任务线程池
SCHEDULED.THREAD.POOL=50

#restTemplate配置
#建立连接时间、单位ms
RestTemplate.ConnectTimeout=20000
#数据传输时间、单位ms
RestTemplate.SocketTimeout=20000
#1.中文、2.英文、3.俄语
Language.Chose=3
#每个整10s触发一次
10s.scheduled.cron.plan=*/10 * * * * *
#每分钟整点触发
1m.scheduled.cron.plan=0 */1 * * * *
#每个整5分钟的05s触发
#eg：5m05s的时候查询[00-05)、10m05s的时候查询[05-10)
5m.scheduled.cron.plan=05 */5 * * * *
#每小时的01分05秒触发
1h.scheduled.cron.plan=05 1 */1 * * *
#每天01:00:05触发
24h.scheduled.cron.plan=05 0 1 * * *

#标签表的刷新时间每隔1小时的1min30s
dict.tag.cron.plan=0 0 */1 * * *
#业务表的刷新时间每隔5min
dict.service.cron.plan=0 */5 * * * *
#协议表的刷新时间每隔5min
dict.protocol.cron.plan=0 */5 * * * *

#测试用
1s.scheduled.cron.plan=*/1 * * * * *

#部署设备数量
Astana.Device.Server.Num=10
Astana.Device.CoreSwtich.Num=20
Astana.Device.AccessSwitch.Num=30
Astana.Device.Asem.Num=10
Astana.Device.Adc.Num=30
Almaty.Device.Server.Num=10
Almaty.Device.CoreSwtich.Num=20
Almaty.Device.AccessSwitch.Num=30
Almaty.Device.Asem.Num=10
Almaty.Device.Adc.Num=30
#互联网监控接口 true表示开启
scheduled.netflow.topn.enable=false
scheduled.netflow.enable=false
#封堵信息接口 true表示开启
scheduled.block.enable=false
scheduled.block.topn.enable=false
#监控接口 true表示开启
scheduled.monitor.enable=false
#事件接口
scheduled.events.enable=true
#接收方服务路径
SERVICE_PATH_BLOCKING=/v1/blocking
SERVICE_PATH_NETFLOW=/v1/netflow
SERVICE_PATH_MONITOR=/v1/system_monitoring
SERVICE_PATH_EVENTS=/v1/events
spring.mvc.view.suffix=.html
#图片储存地址：1.若不指定怎为同jar目录下的image文件夹中，2.不指定时候key不能去掉
Image.Path=
#密钥
jasypt.encryptor.password=f6car
#推送失败时t_loop后再次推送单位:ms
t_loop=120000