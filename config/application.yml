mybatis:
  config-location: classpath:mybatis/mybatis.cfg.xml        # mybatis配置文件所在路径
  type-aliases-package: com.nis.galaxy.domain    # 所有Entity别名类所在包
  mapper-locations:
  - classpath:mybatis/mapper/**/*.xml                       # mapper映射文件

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver              # mariadb驱动包
    url: jdbc:mariadb://192.168.10.204:3306/galaxy-dev        # 数据库名称
    username: ENC(bg9m3MkaQ3VzN6jIz3/3Sw==)
    password: ENC(R1ntF7vlVkCieMwF3V/CwQ==)
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 25
    maxActive: 50
    validationQuery: select 1 FROM DUAL
    maxWait: 60000                                             # 配置获取连接等待超时的时间
    timeBetweenEvictionRunsMillis: 60000                    # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
    minEvictableIdleTimeMillis: 300000                      # 配置一个连接在池中最小生存的时间，单位是毫秒
    testWhileIdle: true
    testOnBorrow: true
    testOnReturn: true
    poolPreparedStatements: true                             # 打开PSCache，并且指定每个连接上PSCache的大小
    maxPoolPreparedStatementPerConnectionSize: 20
